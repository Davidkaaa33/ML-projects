name: Portfolio CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Repository quality
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Check committed diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git diff --check "$BASE_SHA...HEAD"
          else
            git show --check --oneline HEAD
          fi

      - name: Install quality tools
        run: python -m pip install -r requirements-dev.txt

      - name: Ruff
        run: python -m ruff check .

      - name: Compile Python sources
        run: |
          python -m compileall -q             apps/api             bank-transaction-fraud-detection             credit-repayment-prediction             spam-detector             T9-typo-correction             llm-knowledge-base-assistant/app             llm-knowledge-base-assistant/eval

      - name: Validate evaluation artifacts
        run: python scripts/validate_results.py

      - name: Verify pinned direct dependencies
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          requirement_files = [
              Path("requirements-dev.txt"),
              Path("apps/api/requirements.txt"),
              Path("apps/api/requirements-dev.txt"),
              Path("bank-transaction-fraud-detection/requirements.txt"),
              Path("credit-repayment-prediction/requirements.txt"),
              Path("spam-detector/requirements.txt"),
              Path("spam-detector/requirements-dev.txt"),
              Path("T9-typo-correction/requirements.txt"),
              Path("llm-knowledge-base-assistant/requirements.txt"),
              Path("llm-knowledge-base-assistant/requirements-dev.txt"),
              Path("llm-knowledge-base-assistant/requirements-test.txt"),
          ]

          problems = []
          for path in requirement_files:
              for number, raw in enumerate(path.read_text().splitlines(), start=1):
                  line = raw.strip()
                  if not line or line.startswith("#") or line.startswith("-r "):
                      continue
                  if "==" not in line:
                      problems.append(f"{path}:{number}: {line}")

          package = json.loads(Path("apps/web/package.json").read_text())
          for section in ("dependencies", "devDependencies"):
              for name, version in package.get(section, {}).items():
                  if version.startswith(("^", "~", ">", "<", "*")):
                      problems.append(
                          f"apps/web/package.json: {name} is not exactly pinned ({version})"
                      )

          if problems:
              raise SystemExit(
                  "Unpinned direct dependencies:\n" + "\n".join(problems)
              )
          PY

  classical-ml:
    name: Classical ML tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            bank-transaction-fraud-detection/requirements.txt
            credit-repayment-prediction/requirements.txt
            spam-detector/requirements-dev.txt
            T9-typo-correction/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install             -r bank-transaction-fraud-detection/requirements.txt             -r credit-repayment-prediction/requirements.txt             -r spam-detector/requirements-dev.txt             -r T9-typo-correction/requirements.txt
          python -m pip check

      - name: Fraud detection tests
        run: python -m pytest -q bank-transaction-fraud-detection/tests

      - name: Credit repayment tests
        run: python -m pytest -q credit-repayment-prediction/tests

      - name: Spam detector tests
        run: python -m pytest -q spam-detector/tests

      - name: T9 correction tests
        run: python -m pytest -q T9-typo-correction/tests

  rag:
    name: RAG tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: llm-knowledge-base-assistant/requirements-test.txt

      - name: Install test dependencies
        working-directory: llm-knowledge-base-assistant
        run: |
          python -m pip install -r requirements-test.txt
          python -m pip check

      - name: Run tests without Ollama
        working-directory: llm-knowledge-base-assistant
        run: python -m pytest -q tests

  systems-lab:
    name: ML Systems Lab
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt

      - name: Test unified API
        run: |
          python -m pip install -r apps/api/requirements-dev.txt
          python -m pip check
          PYTHONPATH=apps/api python -m pytest -q apps/api/tests

      - name: Build and start product stack
        run: docker compose up -d --build api web

      - name: Wait for web gateway
        run: |
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:8080/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Smoke-test recruiter path
        run: |
          curl --fail --silent http://127.0.0.1:8080/ | grep -q "Machine Learning Engineer"
          curl --fail --silent http://127.0.0.1:8080/api/models | python -m json.tool
          curl --fail --silent             -H "Content-Type: application/json"             -d '{"text":"Call me when you arrive"}'             http://127.0.0.1:8080/api/spam/predict | python -m json.tool
          curl --fail --silent             -H "Content-Type: application/json"             -d '{"text":"I am lerning pythom"}'             http://127.0.0.1:8080/api/t9/correct | python -m json.tool

      - name: Stack logs
        if: always()
        run: docker compose logs || true

      - name: Stop product stack
        if: always()
        run: docker compose down --remove-orphans || true

  spam-container:
    name: Spam API container
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build -t spam-detector-ci ./spam-detector

      - name: Start container
        run: docker run -d --rm --name spam-detector-ci -p 8000:8000 spam-detector-ci

      - name: Wait for health endpoint
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs spam-detector-ci
          exit 1

      - name: Smoke prediction
        run: |
          curl --fail --silent             -H "Content-Type: application/json"             -d '{"text":"Call me when you arrive"}'             http://127.0.0.1:8000/predict | python -m json.tool

      - name: Container logs
        if: always()
        run: docker logs spam-detector-ci || true

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: systems-lab-api
            directory: apps/api
            requirements: requirements-dev.txt
          - project: fraud
            directory: bank-transaction-fraud-detection
            requirements: requirements.txt
          - project: credit
            directory: credit-repayment-prediction
            requirements: requirements.txt
          - project: spam
            directory: spam-detector
            requirements: requirements-dev.txt
          - project: t9
            directory: T9-typo-correction
            requirements: requirements.txt
          - project: rag
            directory: llm-knowledge-base-assistant
            requirements: requirements-dev.txt

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install audit tool
        run: python -m pip install pip-audit==2.10.1

      - name: Audit ${{ matrix.project }}
        working-directory: ${{ matrix.directory }}
        run: python -m pip_audit -r ${{ matrix.requirements }}
