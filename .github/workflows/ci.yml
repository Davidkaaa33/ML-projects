name: Portfolio CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Check committed diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git diff --check "$BASE_SHA...HEAD"
          else
            git show --check --oneline HEAD
          fi

      - name: Install Ruff
        run: python -m pip install ruff==0.16.10

      - name: Lint Python sources
        run: python -m ruff check .

      - name: Compile Python sources
        run: |
          python -m compileall -q             bank-transaction-fraud-detection             credit-repayment-prediction             spam-detector             T9-typo-correction             llm-knowledge-base-assistant/app             llm-knowledge-base-assistant/eval

      - name: Verify direct dependencies are pinned
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [
              Path("bank-transaction-fraud-detection/requirements.txt"),
              Path("credit-repayment-prediction/requirements.txt"),
              Path("spam-detector/requirements.txt"),
              Path("spam-detector/requirements-dev.txt"),
              Path("T9-typo-correction/requirements.txt"),
              Path("llm-knowledge-base-assistant/requirements.txt"),
              Path("llm-knowledge-base-assistant/requirements-dev.txt"),
              Path("llm-knowledge-base-assistant/requirements-test.txt"),
          ]

          problems = []
          for path in files:
              for number, raw in enumerate(path.read_text().splitlines(), start=1):
                  line = raw.strip()
                  if not line or line.startswith("#") or line.startswith("-r "):
                      continue
                  if "==" not in line:
                      problems.append(f"{path}:{number}: {line}")

          if problems:
              raise SystemExit(
                  "Unpinned direct dependencies:\n" + "\n".join(problems)
              )
          PY

  classical-ml:
    name: Classical ML tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            bank-transaction-fraud-detection/requirements.txt
            credit-repayment-prediction/requirements.txt
            spam-detector/requirements-dev.txt
            T9-typo-correction/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install             -r bank-transaction-fraud-detection/requirements.txt             -r credit-repayment-prediction/requirements.txt             -r spam-detector/requirements-dev.txt             -r T9-typo-correction/requirements.txt
          python -m pip check

      - name: Fraud detection tests
        run: python -m pytest -q bank-transaction-fraud-detection/tests

      - name: Credit repayment tests
        run: python -m pytest -q credit-repayment-prediction/tests

      - name: Spam detector tests
        run: python -m pytest -q spam-detector/tests

      - name: T9 correction tests
        run: python -m pytest -q T9-typo-correction/tests

  rag:
    name: RAG tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: llm-knowledge-base-assistant/requirements-test.txt

      - name: Install dependencies
        working-directory: llm-knowledge-base-assistant
        run: |
          python -m pip install -r requirements-test.txt
          python -m pip check

      - name: Run tests without Ollama
        working-directory: llm-knowledge-base-assistant
        run: python -m pytest -q tests

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: fraud
            directory: bank-transaction-fraud-detection
            requirements: requirements.txt
          - project: spam
            directory: spam-detector
            requirements: requirements-dev.txt
          - project: t9
            directory: T9-typo-correction
            requirements: requirements.txt
          - project: rag
            directory: llm-knowledge-base-assistant
            requirements: requirements-dev.txt

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install audit tool
        run: python -m pip install pip-audit==2.10.1

      - name: Audit ${{ matrix.project }}
        working-directory: ${{ matrix.directory }}
        run: python -m pip_audit -r ${{ matrix.requirements }}
